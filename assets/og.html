<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><title>OG image</title>
<style>
@font-face{font-family:"DM Sans";font-weight:100 1000;src:url(../fonts/dm-sans-variable.woff2)}
@font-face{font-family:"Instrument Serif";src:url(../fonts/instrument-serif-regular.woff2)}
@font-face{font-family:"Instrument Serif";font-style:italic;src:url(../fonts/instrument-serif-italic.woff2)}
*{box-sizing:border-box}
body{margin:0;width:1200px;height:630px;background:#f0ede8;color:#1e1b18;font-family:"DM Sans",sans-serif;position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%}
.b1{width:520px;height:520px;right:-120px;top:-160px;background:#dde5ec}
.b2{width:300px;height:300px;right:140px;bottom:-130px;background:#91a5ba}
.wrap{position:absolute;left:96px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
.av{width:150px;height:150px;border-radius:50%;background:#91a5ba;color:#fff;display:grid;place-items:center;font:700 52px "DM Sans";letter-spacing:-.06em;box-shadow:0 20px 40px -12px #1e1b1840}
h1{font:400 112px/1 "Instrument Serif";letter-spacing:-.03em;margin:44px 0 20px}
p{margin:0;font-size:36px;font-weight:300;color:#69675f}
p em{font:italic 400 44px "Instrument Serif";color:#1e1b18}
.pills{position:absolute;right:96px;top:120px;display:flex;flex-direction:column;gap:22px;width:330px}
.pill{height:84px;border-radius:999px;background:#f9f7f3;border:2px solid #0000001a;box-shadow:0 14px 28px -10px #1e1b1833;display:flex;align-items:center;gap:20px;padding:0 14px;font-size:30px;font-weight:500}
.pill i{width:56px;height:56px;border-radius:50%;background:#dde5ec}
.icon{width:180px;height:180px;border-radius:50%;background:#91a5ba;color:#fff;display:grid;place-items:center;font:700 64px "DM Sans";letter-spacing:-.06em}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="wrap"><div class="av">TH</div><h1>Thomas Holland</h1><p>Photos, software and <em>Tin Hut Studio</em></p></div>
<div class="pills"><div class="pill"><i></i>GitHub</div><div class="pill"><i></i>Instagram</div><div class="pill"><i></i>LinkedIn</div></div>
</body></html>
